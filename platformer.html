<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЧИКЕНГАН 🐔</title>
    <link rel="stylesheet" href="platformer.css">
</head>
<body>
    <!-- Главное меню -->
    <div id="menu" class="screen">
        <h1>ЧИКЕНГАН</h1>
        <p>помоги курочке пройти все уровни!</p>
        <button id="start-btn" class="main-btn">играть</button>
        <button id="levels-btn" class="main-btn" style="background: linear-gradient(to bottom, #7a4d9e, #5c3a7a);">выбор уровня</button>
        <div class="controls-hint">
            <div>⬅️ ➡️ (A D / Ф В) — движение</div>
            <div>␣ (пробел) или ⬆️ — прыжок</div>
        </div>
    </div>

    <!-- Экран выбора уровней -->
    <div id="level-select" class="screen" style="display: none;">
        <h2>Выбери уровень</h2>
        <div class="level-grid">
            <button class="level-btn" data-level="1">1</button>
            <button class="level-btn" data-level="2">2</button>
            <button class="level-btn" data-level="3">3</button>
            <button class="level-btn" data-level="4">4</button>
            <button class="level-btn" data-level="5">5</button>
        </div>
        <button id="back-menu-btn" class="main-btn">назад</button>
    </div>

    <!-- Игровой экран -->
    <div id="game" style="display: none;">
        <div id="hud">
            <div class="hud-item">уровень: <span id="level-display">1</span></div>
            <div class="hud-item">жизни: <span id="lives-display">❤️❤️❤️</span></div>
            <div class="hud-item">зёрна: <span id="score-display">0</span> / <span id="total-display">0</span></div>
            <button id="music-toggle" class="hud-btn">🔊</button>
        </div>
        <canvas id="gameCanvas" width="800" height="900"></canvas>
    </div>

    <!-- Экран проигрыша/победы -->
    <div id="gameover" class="screen" style="display: none;">
        <div id="fried-chicken">🍗</div>
        <h2 id="gameover-title">курочка пожарилась...</h2>
        <p id="gameover-text">собрано зёрен: <span id="final-score">0</span></p>
        <button id="restart-btn" class="main-btn">ещё раз</button>
        <button id="to-menu-btn" class="main-btn" style="background: linear-gradient(to bottom, #7a4d9e, #5c3a7a);">в меню</button>
    </div>

    <script src="platformer.js"></script>
</body>
</html>
